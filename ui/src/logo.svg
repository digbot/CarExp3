<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" fill="none">
    <!-- Background -->
    <rect width="300" height="150" fill="white" />

    <!-- Sports car body -->
    <path d="M40 100 Q70 60, 150 60 L230 60 Q270 60, 270 100 L270 110 L40 110 Z" fill="#FF0000" stroke="#000" stroke-width="2"/>

    <!-- Roof -->
    <path d="M90 60 Q130 30, 210 60" fill="none" stroke="#000" stroke-width="2" />

    <!-- Wheels -->
    <circle cx="80" cy="110" r="12" fill="#000" stroke="#fff" stroke-width="2" />
    <circle cx="220" cy="110" r="12" fill="#000" stroke="#fff" stroke-width="2" />

    <!-- Headlights -->
    <circle cx="40" cy="100" r="4" fill="#FFD700" />
    <circle cx="270" cy="100" r="4" fill="#FFD700" />
</svg>
